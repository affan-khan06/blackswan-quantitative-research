[project]
name = "blackswan-risk-engine"
version = "1.0.0"
description = "Regime-aware Monte Carlo portfolio risk intelligence using historical Indian NSE market data, GARCH(1,1) volatility modelling, HMM regime detection, and quantitative stress testing."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "arch>=7.0.0",
    "hmmlearn>=0.3.2",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "yfinance>=0.2.48",
    "httpx>=0.27.2",
    "reportlab>=4.2.5",
    "matplotlib>=3.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
